name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yogeshcodes27
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=A78BFA&color_dots=2d3343,7C3AED,A78BFA,22D3EE,0891B2
            dist/snake-light.svg?palette=github-light&color_snake=7C3AED&color_dots=E8EAF2,C4B5FD,A78BFA,22D3EE,0891B2

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
