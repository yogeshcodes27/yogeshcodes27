name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Contribution Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: yogeshcodes27
          options: custom_title=Yogesh%27s%20Contribution%20Graph&days=31&hide_border=true&bg_color=0D1117&color=C9D1D9&line=8B5CF6&point=A78BFA&area_color=8B5CF6&area=true&grid=false&radius=10&height=320
          output_path: assets/contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git diff --cached --quiet || git commit -m "chore: update contribution graph"
          git push
