name: Generate Contribution Arcade

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Space Shooter
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: yogeshcodes27
          games: 'galaga'

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
